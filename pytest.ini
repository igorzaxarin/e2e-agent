[pytest]
testpaths = output/tests
python_files = test_*.py
python_classes = Test*
# Никаких флагов, пишущих по относительному пути: они резолвятся от текущего
# каталога, а не от rootdir, и засоряют корень репозитория. Каталог результатов
# Allure задаётся явно при запуске — см. --alluredir в отчётах journey.
addopts =
    --strict-markers
    --tb=short
    -v
    -p no:warnings

# Словарь маркеров, которыми владеет человек. Включён --strict-markers:
# незарегистрированный маркер роняет сборку целиком, поэтому под-агенты
# этот файл не правят.
#
# Маркеров J<NN> здесь нет намеренно: их регистрирует корневой conftest.py
# по каталогам output/tests/, иначе конвейер правил бы отслеживаемый файл
# на каждом прогоне по новому корпусу.
markers =
    stub: Тест через детерминированную эмуляцию API (pytest-stub-writer)
    browser: Тест через WebDriver в браузере (browser-test-writer)
    blocker: Шаг, чей ожидаемый результат не определён требованиями — помечен skip

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_cli = false
